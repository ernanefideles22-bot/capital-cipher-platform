name: Gate S3 Opt-in Durable Collector

on:
  pull_request:
    paths:
      - 'backend/app/demo/gate_s3_collector.py'
      - 'backend/app/demo/gate_stage1_shadow.py'
      - 'backend/app/demo/gate_service.py'
      - 'backend/app/strategy/gate_s3*.py'
      - 'backend/app/tests/test_gate_s3*.py'
      - '.github/workflows/gate-stage3-optin-collector.yml'
      - 'docs/gate-s3e-optin-collector-20261102.md'

permissions:
  contents: read

jobs:
  optin-collector-isolation-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYSTEM_MODE: PAPER
      OMS_TESTNET_ENABLED: "false"
      GATE_S1_SHADOW_ENABLED: "false"
      GATE_S2E_SHADOW_ENABLED: "false"
      GATE_S3_SHADOW_ENABLED: "false"
      GATE_OMS_CONNECTION_ENABLED: "false"
      GATE_OMS_WRITES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev,postgres]"
      - name: Test collector, service, recovery and original S1/S2/OMS contracts
        working-directory: backend
        run: |
          python -m pytest -q \
            app/tests/test_gate_s3_collector.py \
            app/tests/test_gate_s3_service_integration.py \
            app/tests/test_gate_s3_paired_evidence.py \
            app/tests/test_gate_s3_equity_valuation.py \
            app/tests/test_gate_s3_durable_research.py \
            app/tests/test_gate_s3_forward_scorecard.py \
            app/tests/test_gate_s2e_shared_shadow.py \
            app/tests/test_gate_s2c_confluence.py \
            app/tests/test_gate_s2d_frozen_forward.py \
            app/tests/test_gate_stage1_shadow_integration.py \
            app/tests/test_gate_stage1_service_integration.py \
            app/tests/test_gate_readonly.py \
            app/tests/test_gate_service.py \
            app/tests/test_gate_oms_connection.py \
            app/tests/test_gate_testnet_execution.py
