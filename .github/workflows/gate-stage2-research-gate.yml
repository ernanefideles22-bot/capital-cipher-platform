name: Gate Professional Trader Stage 2 Research Gate

on:
  pull_request:
    paths:
      - 'backend/app/strategy/gate_classical_s2.py'
      - 'backend/app/strategy/gate_s2_replay.py'
      - 'backend/app/tests/test_gate_s2_classical_replay.py'
      - 'backend/scripts/gate_s2_live_research.py'
      - '.github/workflows/gate-stage2-research-gate.yml'
      - 'docs/73-gate-s2-classical-research-20261101.md'

permissions:
  contents: read

jobs:
  stage2-isolated-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYSTEM_MODE: PAPER
      OMS_TESTNET_ENABLED: "false"
      GATE_S1_SHADOW_ENABLED: "false"
      GATE_OMS_WRITES_ENABLED: "false"
      GATE_OMS_CONNECTION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev,postgres]"
      - name: Test S2 brokerless strategy research and S1/OMS regression
        working-directory: backend
        run: |
          python -m pytest -q \
            app/tests/test_gate_s2_classical_replay.py \
            app/tests/test_professional_gate_chart_stage1.py \
            app/tests/test_gate_stage1_shadow_integration.py \
            app/tests/test_gate_stage1_service_integration.py \
            app/tests/test_gate_market.py \
            app/tests/test_gate_oms_connection.py \
            app/tests/test_gate_readonly.py
  gate-testnet-historical-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SYSTEM_MODE: PAPER
      OMS_TESTNET_ENABLED: "false"
      GATE_S1_SHADOW_ENABLED: "false"
      GATE_OMS_WRITES_ENABLED: "false"
      GATE_OMS_CONNECTION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install brokerless analysis dependencies
        working-directory: backend
        run: python -m pip install -e ".[postgres]"
      - name: Run historical 60/40 diagnostics using public Gate TestNet candles
        working-directory: backend
        run: python -m scripts.gate_s2_live_research
