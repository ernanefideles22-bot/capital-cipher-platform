name: Gate S4 Historical Statistical Validation
on:
  pull_request:
    paths:
      - 'backend/app/strategy/gate_s4*.py'
      - 'backend/app/strategy/gate_s5*.py'
      - 'backend/app/strategy/gate_classical_s2.py'
      - 'backend/app/strategy/gate_s2_replay.py'
      - 'backend/app/tests/test_gate_s4*.py'
      - 'backend/scripts/gate_s4*.py'
      - '.github/workflows/gate-stage4-historical-statistics.yml'
      - 'docs/gate-s4-historical-statistical-validation-20261103.md'
permissions:
  contents: read
jobs:
  statistical-oracles-and-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYSTEM_MODE: PAPER
      OMS_TESTNET_ENABLED: "false"
      GATE_S1_SHADOW_ENABLED: "false"
      GATE_S2E_SHADOW_ENABLED: "false"
      GATE_S3_SHADOW_ENABLED: "false"
      GATE_OMS_CONNECTION_ENABLED: "false"
      GATE_OMS_WRITES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests
        working-directory: backend
        run: python -m pip install -e ".[dev,postgres]"
      - name: Test statistical arithmetic, public-source rejection, replay and S3 boundaries
        working-directory: backend
        run: |
          python -m pytest -q \
            app/tests/test_gate_s4_historical_validation.py \
            app/tests/test_gate_s4_s5_lab.py \
            app/tests/test_gate_s2_classical_replay.py \
            app/tests/test_gate_s3_financial_review.py \
            app/tests/test_gate_s3_equity_valuation.py \
            app/tests/test_gate_s3_paired_evidence.py \
            app/tests/test_gate_s3_durable_research.py \
            app/tests/test_gate_s3_forward_scorecard.py \
            app/tests/test_gate_s3_collector.py \
            app/tests/test_gate_s3_service_integration.py \
            app/tests/test_gate_s3_process_drill.py
