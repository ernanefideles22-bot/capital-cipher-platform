name: Isolated PAPER Backend Tests

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/isolated-paper-tests-20261022'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/isolated-paper-tests.yml'

permissions:
  contents: read

jobs:
  isolated-paper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
      REDIS_TEST_URL: ''
      POSTGRES_TEST_URL: ''
      SYSTEM_MODE: PAPER
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev,postgres]"
      - name: Verify isolated data, risk, OMS, PAPER, and agent orchestration
        working-directory: backend
        run: |
          python -m pytest -q \
            app/tests/test_durable_data_lake.py \
            app/tests/test_time_series_catalog.py \
            app/tests/test_risk.py \
            app/tests/test_paper_trading.py \
            app/tests/test_month_6_central_risk.py \
            app/tests/test_month_7_oms.py \
            app/tests/test_month_5_agent_runtime.py \
            app/tests/test_orchestrator_e2e.py \
            app/tests/test_dashboard_contract.py \
            app/tests/test_staging_paper.py

      - name: Run E2.0 frozen chart skill benchmark (no network or execution)
        working-directory: backend
        run: |
          python -m pytest -q app/tests/test_research_benchmark_e20.py
          python -m scripts.run_e20_chart_skill_benchmark
      - name: E2.4 independent market candle provenance safeguards
        working-directory: backend
        run: |
          python -m pytest -q app/tests/test_paper_market_provenance_e24.py app/tests/test_paper_forensics_e1.py
      - name: E2.3 SQL aggregation and historical cohort safeguards
        working-directory: backend
        run: |
          python -m pytest -q app/tests/test_paper_agent_cohort_e23.py app/tests/test_paper_forensics_e1.py
      - name: E2.2 read-only agent quality and auditor integration regressions
        working-directory: backend
        run: |
          python -m pytest -q app/tests/test_paper_agent_quality_e22.py app/tests/test_paper_forensics_e1.py
      - name: Run E2.1 matched core-agent vs chart benchmark (isolated)
        working-directory: backend
        run: |
          python -m pytest -q app/tests/test_matched_signal_replay_e21.py
          python -m scripts.run_e21_matched_core_agent_benchmark
