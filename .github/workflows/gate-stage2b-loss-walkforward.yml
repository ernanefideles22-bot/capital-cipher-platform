name: Gate Stage 2B Cost Attribution and Walk Forward

on:
  pull_request:
    paths:
      - 'backend/app/strategy/gate_s2_loss_diagnostics.py'
      - 'backend/app/tests/test_gate_s2b_loss_diagnostics.py'
      - 'backend/scripts/gate_s2b_loss_walkforward.py'
      - '.github/workflows/gate-stage2b-loss-walkforward.yml'
      - 'docs/74-gate-stage2b-loss-walkforward-20261101.md'

permissions:
  contents: read

jobs:
  s2b-brokerless-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYSTEM_MODE: PAPER
      OMS_TESTNET_ENABLED: "false"
      GATE_S1_SHADOW_ENABLED: "false"
      GATE_OMS_WRITES_ENABLED: "false"
      GATE_OMS_CONNECTION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev,postgres]"
      - name: Test cost attribution, chronological folds, frozen decisions and OMS regression
        working-directory: backend
        run: |
          python -m pytest -q \
            app/tests/test_gate_s2b_loss_diagnostics.py \
            app/tests/test_gate_s2_classical_replay.py \
            app/tests/test_gate_stage1_shadow_integration.py \
            app/tests/test_gate_stage1_service_integration.py \
            app/tests/test_gate_readonly.py \
            app/tests/test_gate_oms_connection.py
  s2b-gate-real-market-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYSTEM_MODE: PAPER
      OMS_TESTNET_ENABLED: "false"
      GATE_S1_SHADOW_ENABLED: "false"
      GATE_OMS_WRITES_ENABLED: "false"
      GATE_OMS_CONNECTION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public GET research dependencies
        working-directory: backend
        run: python -m pip install -e ".[postgres]"
      - name: Audit breakdown across real public Gate OHLCV, 3 disjoint OOS folds
        working-directory: backend
        run: python -m scripts.gate_s2b_loss_walkforward
