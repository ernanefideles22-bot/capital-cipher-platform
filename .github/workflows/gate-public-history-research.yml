name: Gate public historical research (read-only)

on:
  pull_request:
    paths:
      - '.github/workflows/gate-public-history-research.yml'
      - 'backend/scripts/gate_public_history_research.py'
      - 'backend/app/tests/test_gate_public_history_research_d23.py'

permissions:
  contents: read

jobs:
  gate-research:
    name: Public Gate OHLCV and funding research snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing Python backend dependencies
        run: python -m pip install -e './backend'
      - name: Validate Gate REST schema without external calls
        run: python -m pytest backend/app/tests/test_gate_public_history_research_d23.py -q -s
      - name: Collect retrospective public Gate observations only
        run: |
          python backend/scripts/gate_public_history_research.py \
            --cutoff 2026-10-31T18:00:00+00:00 \
            --out "$RUNNER_TEMP/gate-read-only-research"
      - name: Archive dataset and results (if collected)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-readonly-historical-${{ github.run_id }}
          path: ${{ runner.temp }}/gate-read-only-research/
          if-no-files-found: warn
          retention-days: 7
