name: Gate S3 Durable Research and Restart Recovery

on:
  pull_request:
    paths:
      - 'backend/app/strategy/gate_s3_durable_research.py'
      - 'backend/app/tests/test_gate_s3_durable_research.py'
      - '.github/workflows/gate-stage3-durable-research.yml'
      - 'docs/79-gate-s3-durable-research-20261101.md'

permissions:
  contents: read

jobs:
  s3-isolated-crash-recovery-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYSTEM_MODE: PAPER
      OMS_TESTNET_ENABLED: "false"
      GATE_S1_SHADOW_ENABLED: "false"
      GATE_S2E_SHADOW_ENABLED: "false"
      GATE_OMS_CONNECTION_ENABLED: "false"
      GATE_OMS_WRITES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev,postgres]"
      - name: Run append-only research recovery, isolated S3 and S1/S2/OMS regressions
        working-directory: backend
        run: |
          python -m pytest -q \
            app/tests/test_gate_s3_durable_research.py \
            app/tests/test_gate_s3_forward_scorecard.py \
            app/tests/test_gate_s2e_shared_shadow.py \
            app/tests/test_gate_s2c_confluence.py \
            app/tests/test_gate_s2d_frozen_forward.py \
            app/tests/test_gate_stage1_shadow_integration.py \
            app/tests/test_gate_stage1_service_integration.py \
            app/tests/test_gate_readonly.py \
            app/tests/test_gate_oms_connection.py
