name: One-shot catalog test isolation patch

on:
  push:
    branches: [fix/main-release-governance-20261009]
    paths: [.github/workflows/patch-main-catalog-test.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/main-release-governance-20261009
      - name: Isolate API catalog test on file-backed SQLite
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/tests/test_time_series_catalog.py')
          text = path.read_text(encoding='utf-8')
          old = '''async def test_protected_catalog_api_materializes_and_reads_manifest():
              admin_key = "c" * 32
              settings = Settings(
                  ADMIN_API_KEY=admin_key,
                  DATABASE_URL="sqlite+aiosqlite:///:memory:",
              )
          '''.replace('              ', '')
          new = '''async def test_protected_catalog_api_materializes_and_reads_manifest(tmp_path):
              admin_key = "c" * 32
              database_path = tmp_path / "catalog-api.db"
              settings = Settings(
                  ADMIN_API_KEY=admin_key,
                  DATABASE_URL=f"sqlite+aiosqlite:///{database_path}",
              )
          '''.replace('              ', '')
          if old not in text:
              raise SystemExit('catalog test anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev,postgres]"
      - name: Run exact regression
        working-directory: backend
        run: python -m pytest app/tests/test_time_series_catalog.py::test_protected_catalog_api_materializes_and_reads_manifest -q
      - name: Commit tested isolation fix and remove workflow
        shell: bash
        run: |
          rm .github/workflows/patch-main-catalog-test.yml
          git config user.name "capital-cipher-ci"
          git config user.email "capital-cipher-ci@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize protected catalog API test isolation"
          git push origin HEAD:fix/main-release-governance-20261009
