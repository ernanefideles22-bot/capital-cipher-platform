name: Alpha audit cloud (PAPER only)
on:
  push:
    branches:
      - audit/alpha-cloud-20261028
    paths:
      - 'backend/agent_alpha_test.py'
      - 'backend/download_klines.py'
      - '.github/workflows/alpha-cloud-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: alpha-audit-cloud
  cancel-in-progress: true
jobs:
  btc-1h:
    name: BTCUSDT 1h - out-of-sample alpha
    runs-on: ubuntu-latest
    timeout-minutes: 110
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml
      - name: Install local backend (no exchange credentials)
        run: python -m pip install -e '.[dev]' numpy
      - name: Download official Binance Spot monthly BTCUSDT 1h candles (fail closed)
        run: python download_klines.py --symbol BTCUSDT --tf 1h --start 2024-01 --end 2026-09 --out klines
      - name: Verify expected month count and archive integrity
        run: |
          python - <<'PY'
          import pathlib,zipfile
          files=sorted(pathlib.Path('klines').glob('BTCUSDT-1h-*.zip'))
          print('monthly files:',len(files))
          if len(files)!=33: raise SystemExit('Incomplete months: expected 33')
          for x in files:
            with zipfile.ZipFile(x) as z:
              if z.testzip(): raise SystemExit(f'Bad archive {x}')
          PY
      - name: Run 299-agent PAPER research harness (never places orders)
        id: alpha
        run: python agent_alpha_test.py --mode binance --dir klines --symbol BTCUSDT --tf 1h --out btc1h.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capital-cipher-alpha-btc1h
          path: backend/btc1h.json
          if-no-files-found: warn
          retention-days: 14
      - name: Store outcome on isolated audit branch for mobile retrieval
        if: always()
        working-directory: .
        env:
          ALPHA_OUTCOME: ${{ steps.alpha.outcome }}
        run: |
          mkdir -p alpha-results
          echo "GitHub Actions test outcome: $ALPHA_OUTCOME" > alpha-results/status.txt
          echo "Commit: $GITHUB_SHA" >> alpha-results/status.txt
          echo "Workflow: $GITHUB_RUN_ID" >> alpha-results/status.txt
          if test -f backend/btc1h.json; then
            cp backend/btc1h.json alpha-results/btc1h.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alpha-results/
          if ! git diff --cached --quiet; then
            git commit -m "audit(results): store cloud alpha run outcome [skip ci]"
            git push origin HEAD:audit/alpha-cloud-20261028
          fi
