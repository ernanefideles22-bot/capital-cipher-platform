name: One-shot specialist evidence repair

on:
  push:
    branches: [fix/staging-critical-repair-20261009]
    paths:
      - .github/workflows/repair-specialist-evidence.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/staging-critical-repair-20261009
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply exact specialist evidence repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          repository_path = Path("backend/app/database/repositories/repository.py")
          text = repository_path.read_text(encoding="utf-8")

          old = "from sqlalchemy import and_, func, or_, select, tuple_, update\n"
          new = (
              "from pydantic import ValidationError as PydanticValidationError\n"
              "from sqlalchemy import and_, func, or_, select, tuple_, update\n"
          )
          if old not in text:
              raise SystemExit("repository import anchor not found")
          text = text.replace(old, new, 1)

          anchor = '''    @staticmethod
              def _agent_forecast_from_row(
                  row: AgentForecastModel,
              ) -> AgentForecast:
          '''.replace("              ", "")
          helper = '''    @staticmethod
              def _same_specialist_source_event(
                  stored: SpecialistEvidence,
                  incoming: SpecialistEvidence,
              ) -> bool:
                  """Compare provider-event identity while excluding receipt metadata."""

                  immutable_source_fields = (
                      "schema_version",
                      "domain",
                      "metric_name",
                      "scope",
                      "source",
                      "source_event_id",
                      "value",
                      "unit",
                      "quality_score",
                      "observed_at",
                      "provenance_uri",
                      "payload_sha256",
                  )
                  return all(
                      getattr(stored, field) == getattr(incoming, field)
                      for field in immutable_source_fields
                  )

          '''.replace("              ", "")
          if anchor not in text:
              raise SystemExit("specialist helper anchor not found")
          text = text.replace(anchor, helper + anchor, 1)

          old_source_event = '''                if source_event is not None:
                      stored = self._specialist_evidence_from_row(source_event)
                      if stored != evidence:
                          raise ValidationError(
                              "Source event already maps to different evidence"
                          )
                      return stored
          '''.replace("                      ", "")
          new_source_event = '''                if source_event is not None:
                      stored = self._specialist_evidence_from_row(source_event)
                      if not self._same_specialist_source_event(stored, evidence):
                          raise ValidationError(
                              "Source event already maps to different evidence"
                          )
                      return stored
          '''.replace("                      ", "")
          if old_source_event not in text:
              raise SystemExit("source-event idempotency anchor not found")
          text = text.replace(old_source_event, new_source_event, 1)

          old_list = '''    async def list_specialist_evidence(
                  self,
                  *,
                  limit: int = 100,
              ) -> list[SpecialistEvidence]:
                  if not 1 <= limit <= 100_000:
                      raise ValueError("Specialist evidence limit must be 1..100000")
                  async with self._db.session() as session:
                      rows = list(
                          await session.scalars(
                              select(SpecialistEvidenceModel)
                              .order_by(
                                  SpecialistEvidenceModel.observed_at.desc(),
                                  SpecialistEvidenceModel.evidence_id,
                              )
                              .limit(limit)
                          )
                      )
                      return [
                          self._specialist_evidence_from_row(row)
                          for row in rows
                      ]
          '''.replace("                  ", "")
          new_list = '''    async def list_specialist_evidence_with_rejections(
                  self,
                  *,
                  limit: int = 100,
              ) -> tuple[list[SpecialistEvidence], list[dict[str, str]]]:
                  """Load valid evidence and logically quarantine only invalid rows."""

                  if not 1 <= limit <= 100_000:
                      raise ValueError("Specialist evidence limit must be 1..100000")
                  async with self._db.session() as session:
                      rows = list(
                          await session.scalars(
                              select(SpecialistEvidenceModel)
                              .order_by(
                                  SpecialistEvidenceModel.observed_at.desc(),
                                  SpecialistEvidenceModel.evidence_id,
                              )
                              .limit(limit)
                          )
                      )
                  valid: list[SpecialistEvidence] = []
                  rejected: list[dict[str, str]] = []
                  for row in rows:
                      try:
                          valid.append(self._specialist_evidence_from_row(row))
                      except PydanticValidationError as exc:
                          rejected.append(
                              {
                                  "evidence_id": row.evidence_id,
                                  "source": row.source,
                                  "source_event_id": row.source_event_id,
                                  "error_type": type(exc).__name__,
                                  "error": str(exc),
                              }
                          )
                  return valid, rejected

              async def list_specialist_evidence(
                  self,
                  *,
                  limit: int = 100,
              ) -> list[SpecialistEvidence]:
                  valid, _ = await self.list_specialist_evidence_with_rejections(
                      limit=limit
                  )
                  return valid
          '''.replace("                  ", "")
          if old_list not in text:
              raise SystemExit("specialist list anchor not found")
          text = text.replace(old_list, new_list, 1)
          repository_path.write_text(text, encoding="utf-8")

          evaluation_path = Path("backend/app/agents/evaluation.py")
          text = evaluation_path.read_text(encoding="utf-8")
          old_initialize = '''    async def initialize(self) -> None:
                  if self._repository is None:
                      return
                  try:
                      historical = await self._repository.list_specialist_evidence(
                          limit=10_000
                      )
                  except PydanticValidationError as exc:
                      # Legacy rows written before values were canonicalized to the
                      # NUMERIC(38,18) persistence boundary may no longer reproduce their
                      # pre-persistence evidence_id. They are advisory SHADOW evidence and
                      # must never be trusted after an integrity failure. Keep the rows in
                      # PostgreSQL for audit, exclude the whole historical set from runtime,
                      # and let governed collectors repopulate fresh evidence on new candle
                      # buckets. Database availability errors still propagate and fail startup.
                      self.historical_integrity_rejected = True
                      self._items.clear()
                      self._source_events.clear()
                      logger.error(
                          "Persisted specialist evidence failed immutable identity validation; "
                          "historical evidence excluded from runtime",
                          event_type="SPECIALIST_EVIDENCE_INTEGRITY_REJECTED",
                          metadata={"error_type": type(exc).__name__},
                      )
                      return
                  for evidence in historical:
                      self._items[evidence.evidence_id] = evidence
                      self._source_events[
                          (evidence.source, evidence.source_event_id)
                      ] = evidence.evidence_id
          '''.replace("                  ", "")
          new_initialize = '''    async def initialize(self) -> None:
                  if self._repository is None:
                      return
                  rejected: list[dict[str, str]] = []
                  quarantine_loader = getattr(
                      self._repository,
                      "list_specialist_evidence_with_rejections",
                      None,
                  )
                  if quarantine_loader is not None:
                      historical, rejected = await quarantine_loader(limit=10_000)
                  else:
                      try:
                          historical = await self._repository.list_specialist_evidence(
                              limit=10_000
                          )
                      except PydanticValidationError as exc:
                          # Compatibility path for repositories that do not expose
                          # row-level quarantine. Availability errors still propagate.
                          historical = []
                          rejected = [
                              {
                                  "evidence_id": "unknown",
                                  "source": "unknown",
                                  "source_event_id": "unknown",
                                  "error_type": type(exc).__name__,
                                  "error": str(exc),
                              }
                          ]
                  if rejected:
                      self.historical_integrity_rejected = True
                      logger.error(
                          "Persisted specialist evidence failed immutable identity validation; "
                          "invalid rows quarantined from runtime",
                          event_type="SPECIALIST_EVIDENCE_INTEGRITY_REJECTED",
                          metadata={
                              "rejected_count": len(rejected),
                              "rejected": rejected[:20],
                          },
                      )
                  for evidence in historical:
                      self._items[evidence.evidence_id] = evidence
                      self._source_events[
                          (evidence.source, evidence.source_event_id)
                      ] = evidence.evidence_id
          '''.replace("                  ", "")
          if old_initialize not in text:
              raise SystemExit("evaluation initialize anchor not found")
          text = text.replace(old_initialize, new_initialize, 1)
          evaluation_path.write_text(text, encoding="utf-8")

          test_path = Path("backend/app/tests/test_specialist_evidence_integrity.py")
          text = test_path.read_text(encoding="utf-8")
          import_anchor = "from app.agents.evaluation import SpecialistEvidenceService\n"
          if import_anchor not in text:
              raise SystemExit("test import anchor not found")
          text = text.replace(
              import_anchor,
              import_anchor + "from app.database.repositories.repository import Repository\n",
              1,
          )
          function_anchor = '''def test_specialist_evidence_identity_survives_numeric_38_18_roundtrip() -> None:
          '''
          extra_test = '''def test_source_event_idempotency_ignores_receipt_timestamp() -> None:
                  first = _evidence(value=0.001)
                  repeated = SpecialistEvidence(
                      domain=first.domain,
                      metric_name=first.metric_name,
                      scope=first.scope,
                      source=first.source,
                      source_event_id=first.source_event_id,
                      value=first.value,
                      unit=first.unit,
                      quality_score=first.quality_score,
                      observed_at=first.observed_at,
                      received_at=first.received_at + timedelta(minutes=5),
                      provenance_uri=first.provenance_uri,
                      payload_sha256=first.payload_sha256,
                  )

                  assert repeated.evidence_id != first.evidence_id
                  assert Repository._same_specialist_source_event(first, repeated) is True


          '''.replace("                  ", "")
          if function_anchor not in text:
              raise SystemExit("test function anchor not found")
          text = text.replace(function_anchor, extra_test + function_anchor, 1)

          append_anchor = '''class UnavailableRepository:
          '''
          mixed_test = '''class MixedIntegrityRepository:
                  def __init__(self) -> None:
                      self.valid = _evidence(value=0.002)

                  async def list_specialist_evidence_with_rejections(self, *, limit: int):
                      assert limit == 10_000
                      return [self.valid], [
                          {
                              "evidence_id": "0" * 64,
                              "source": "binance.usdm.public",
                              "source_event_id": "legacy-corrupt-event",
                              "error_type": "ValidationError",
                              "error": "evidence_id does not match immutable evidence",
                          }
                      ]


              @pytest.mark.asyncio
              async def test_invalid_history_row_is_quarantined_without_dropping_valid_rows() -> None:
                  repository = MixedIntegrityRepository()
                  service = SpecialistEvidenceService(repository)

                  await service.initialize()

                  assert service.historical_integrity_rejected is True
                  assert await service.list(limit=10) == [repository.valid]


          '''.replace("              ", "")
          if append_anchor not in text:
              raise SystemExit("mixed-integrity test anchor not found")
          text = text.replace(append_anchor, mixed_test + append_anchor, 1)
          test_path.write_text(text, encoding="utf-8")
          PY

      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev,postgres]"

      - name: Run specialist evidence regression tests
        working-directory: backend
        run: python -m pytest app/tests/test_specialist_evidence_integrity.py app/tests/test_binance_derivatives_evidence.py -q

      - name: Commit tested repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "capital-cipher-ci"
          git config user.email "capital-cipher-ci@users.noreply.github.com"
          git add backend/app/database/repositories/repository.py backend/app/agents/evaluation.py backend/app/tests/test_specialist_evidence_integrity.py
          git commit -m "Fix specialist evidence idempotency and row quarantine"
          git push origin HEAD:fix/staging-critical-repair-20261009
