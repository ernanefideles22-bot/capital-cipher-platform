name: Gate Professional Trader Stage 1 Research Gate

on:
  pull_request:
    paths:
      - 'backend/app/demo/gate_*'
      - 'backend/app/agents/gate_professional_chart_shadow.py'
      - 'backend/app/strategy/market_intelligence.py'
      - 'backend/app/strategy/professional_gate_chart_stage1.py'
      - 'backend/app/tests/test_professional_gate_chart_stage1.py'
      - 'backend/app/tests/test_gate_professional_chart_shadow_stage1.py'
      - 'backend/app/tests/test_gate_stage1*'
      - '.github/workflows/gate-professional-stage1.yml'

permissions:
  contents: read

jobs:
  gate-stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYSTEM_MODE: PAPER
      OMS_TESTNET_ENABLED: "false"
      GATE_S1_SHADOW_ENABLED: "false"
      GATE_OMS_WRITES_ENABLED: "false"
      GATE_OMS_CONNECTION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev,postgres]"
      - name: Verify Gate Stage 1, 300-agent legacy contract and safety
        working-directory: backend
        run: |
          python -m pytest -q \
            app/tests/test_professional_gate_chart_stage1.py \
            app/tests/test_gate_professional_chart_shadow_stage1.py \
            app/tests/test_gate_stage1_shadow_integration.py \
            app/tests/test_gate_stage1_service_integration.py \
            app/tests/test_gate_service.py \
            app/tests/test_gate_market.py \
            app/tests/test_gate_analysis.py \
            app/tests/test_gate_readonly.py \
            app/tests/test_gate_oms_connection.py \
            app/tests/test_gate_research_journal.py
