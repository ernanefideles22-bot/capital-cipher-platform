name: Gate S4 Purged Regime Signal
on:
  pull_request:
    paths:
      - 'backend/app/strategy/gate_s4_regime_signal*.py'
      - 'backend/app/tests/test_gate_s4_regime_signal.py'
      - 'backend/scripts/gate_s4_regime_signal.py'
      - '.github/workflows/gate-stage4-regime-signal.yml'
      - 'docs/gate-s4-regime-signal-20261103.md'
permissions:
  contents: read
jobs:
  fit-only-scaling-purged-labels-shared-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYSTEM_MODE: PAPER
      OMS_TESTNET_ENABLED: "false"
      GATE_S1_SHADOW_ENABLED: "false"
      GATE_S2E_SHADOW_ENABLED: "false"
      GATE_S3_SHADOW_ENABLED: "false"
      GATE_OMS_CONNECTION_ENABLED: "false"
      GATE_OMS_WRITES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests
        working-directory: backend
        run: python -m pip install -e ".[dev,postgres]"
      - name: Verify causal model and research boundaries
        working-directory: backend
        run: |
          python -m pytest -q \
            app/tests/test_gate_s4_regime_signal.py \
            app/tests/test_gate_s4_momentum_diagnostics.py \
            app/tests/test_gate_s4_slow_momentum.py \
            app/tests/test_gate_s4_complete_playbooks.py \
            app/tests/test_gate_s4_playbook_study.py \
            app/tests/test_gate_s4_real_revisions.py \
            app/tests/test_gate_s4_historical_validation.py \
            app/tests/test_gate_s4_s5_lab.py \
            app/tests/test_gate_s2_classical_replay.py \
            app/tests/test_gate_s2b_loss_diagnostics.py \
            app/tests/test_gate_s3_financial_review.py \
            app/tests/test_gate_s3_equity_valuation.py \
            app/tests/test_gate_s3_paired_evidence.py \
            app/tests/test_gate_s3_durable_research.py \
            app/tests/test_gate_s3_forward_scorecard.py \
            app/tests/test_gate_s3_collector.py \
            app/tests/test_gate_s3_service_integration.py \
            app/tests/test_gate_s3_process_drill.py
