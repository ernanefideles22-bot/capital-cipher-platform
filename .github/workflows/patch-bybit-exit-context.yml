name: Wire internal Bybit TESTNET exit service

on:
  push:
    branches: [fix/bybit-testnet-safety]
    paths:
      - .github/workflows/patch-bybit-exit-context.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/bybit-testnet-safety
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Wire exit service without public route
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/api/context.py')
          text = path.read_text(encoding='utf-8')

          old = 'from app.oms.reconciliation import ReconciliationService\nfrom app.oms.service import OMSService\n'
          new = 'from app.oms.bybit_testnet_exit import BybitTestnetExitService\nfrom app.oms.reconciliation import ReconciliationService\nfrom app.oms.service import OMSService\n'
          if old not in text:
              raise SystemExit('OMS import anchor not found')
          text = text.replace(old, new, 1)

          old = '    release_readiness_service: ReleaseReadinessService | None = None\n    market_connected: bool = False\n'
          new = '    release_readiness_service: ReleaseReadinessService | None = None\n    bybit_testnet_exit_service: BybitTestnetExitService | None = None\n    market_connected: bool = False\n'
          if old not in text:
              raise SystemExit('AppContext field anchor not found')
          text = text.replace(old, new, 1)

          old = '''    reconciliation_service = ReconciliationService(\n        adapter=oms_service.adapter,\n        risk_manager=risk_manager,\n        audit_service=audit_service,\n        repository=repository,\n        halt_on_critical_drift=settings.oms_halt_on_critical_drift,\n        interval_seconds=settings.oms_reconciliation_interval_seconds,\n    )\n'''
          new = old + '''    bybit_testnet_exit_service = None\n    if (\n        target_environment == ExecutionEnvironment.TESTNET\n        and target_exchange == Exchange.BYBIT\n    ):\n        bybit_testnet_exit_service = BybitTestnetExitService(\n            adapter=oms_service.adapter,\n            risk_manager=risk_manager,\n            audit_service=audit_service,\n        )\n'''
          if old not in text:
              raise SystemExit('reconciliation construction anchor not found')
          text = text.replace(old, new, 1)

          old = '        release_readiness_service=release_readiness_service,\n    )\n'
          new = '        release_readiness_service=release_readiness_service,\n        bybit_testnet_exit_service=bybit_testnet_exit_service,\n    )\n'
          if old not in text:
              raise SystemExit('AppContext construction anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test = Path('backend/app/tests/test_bybit_exit_context_wiring.py')
          test.write_text('''"""Composition-root safety for the Bybit TESTNET emergency exit service."""\n\nfrom pathlib import Path\n\n\ndef test_bybit_exit_service_is_internal_and_has_no_public_route():\n    root = Path(__file__).resolve().parents[1]\n    context = (root / 'api' / 'context.py').read_text(encoding='utf-8')\n    routes = root / 'api' / 'routes'\n    route_text = '\\n'.join(\n        item.read_text(encoding='utf-8') for item in routes.glob('*.py')\n    )\n\n    assert 'BybitTestnetExitService' in context\n    assert 'bybit_testnet_exit_service=bybit_testnet_exit_service' in context\n    assert 'flatten_after_kill_switch' not in route_text\n    assert 'submit_reduce_only_exit' not in route_text\n''', encoding='utf-8')
          PY
      - name: Commit internal exit wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/api/context.py backend/app/tests/test_bybit_exit_context_wiring.py
          git diff --cached --check
          git commit -m "fix: wire internal Bybit TESTNET flatten service"
          git push origin HEAD:fix/bybit-testnet-safety
