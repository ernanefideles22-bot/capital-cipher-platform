name: Gate S3 Offline Financial Review
on:
  pull_request:
    paths:
      - 'backend/app/strategy/gate_s3*.py'
      - 'backend/app/tests/test_gate_s3*.py'
      - 'backend/scripts/gate_s3_financial_review.py'
      - '.github/workflows/gate-stage3-financial-review.yml'
      - 'docs/gate-s3-financial-review-and-rollout-20261102.md'
permissions:
  contents: read
jobs:
  financial-oracles-and-read-only-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYSTEM_MODE: PAPER
      OMS_TESTNET_ENABLED: "false"
      GATE_S1_SHADOW_ENABLED: "false"
      GATE_S2E_SHADOW_ENABLED: "false"
      GATE_S3_SHADOW_ENABLED: "false"
      GATE_OMS_CONNECTION_ENABLED: "false"
      GATE_OMS_WRITES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev,postgres]"
      - name: Test financial review and durable collection boundaries
        working-directory: backend
        run: |
          python -m pytest -q \
            app/tests/test_gate_s3_financial_review.py \
            app/tests/test_gate_s3_equity_valuation.py \
            app/tests/test_gate_s3_paired_evidence.py \
            app/tests/test_gate_s3_durable_research.py \
            app/tests/test_gate_s3_forward_scorecard.py \
            app/tests/test_gate_s3_collector.py \
            app/tests/test_gate_s3_service_integration.py \
            app/tests/test_gate_s3_process_drill.py
