name: Gate S2E Shared Candle SHADOW Research Gate

on:
  pull_request:
    paths:
      - 'backend/app/strategy/gate_s2e_live_shadow.py'
      - 'backend/app/demo/gate_stage1_shadow.py'
      - 'backend/app/demo/gate_service.py'
      - 'backend/app/tests/test_gate_s2e_shared_shadow.py'
      - '.github/workflows/gate-stage2e-shared-shadow.yml'
      - 'docs/77-gate-s2e-shared-shadow-20261101.md'

permissions:
  contents: read

jobs:
  isolated-s1-s2-shadow-and-oms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYSTEM_MODE: PAPER
      OMS_TESTNET_ENABLED: "false"
      GATE_S1_SHADOW_ENABLED: "false"
      GATE_S2E_SHADOW_ENABLED: "false"
      GATE_OMS_CONNECTION_ENABLED: "false"
      GATE_OMS_WRITES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated tests
        working-directory: backend
        run: python -m pip install -e ".[dev,postgres]"
      - name: Validate S1+S2 shared state, receipts, no OMS writes and older integrations
        working-directory: backend
        run: |
          python -m pytest -q \
            app/tests/test_gate_s2e_shared_shadow.py \
            app/tests/test_gate_stage1_shadow_integration.py \
            app/tests/test_gate_stage1_service_integration.py \
            app/tests/test_gate_s2c_confluence.py \
            app/tests/test_gate_s2d_frozen_forward.py \
            app/tests/test_gate_readonly.py \
            app/tests/test_gate_oms_connection.py
