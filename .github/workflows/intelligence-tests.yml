name: Intelligence module tests

on:
  pull_request:
    paths:
      - 'backend/app/agents/intelligence/**'
      - 'backend/app/tests/test_intelligence_*.py'
      - 'backend/pyproject.toml'
      - '.github/workflows/intelligence-tests.yml'
  push:
    branches:
      - feature/capital-cipher-ai-brain
    paths:
      - 'backend/app/agents/intelligence/**'
      - 'backend/app/tests/test_intelligence_*.py'
      - 'backend/pyproject.toml'
      - '.github/workflows/intelligence-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
      REDIS_TEST_URL: ''
      POSTGRES_TEST_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Run intelligence contract tests
        working-directory: backend
        run: python -m pytest app/tests/test_intelligence_reasoning.py app/tests/test_intelligence_forecast_scoring.py app/tests/test_intelligence_forecast_memory_sqlite.py app/tests/test_intelligence_shadow_observer.py app/tests/test_intelligence_evidence_collector.py -q
