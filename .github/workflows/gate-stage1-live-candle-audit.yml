name: Gate Stage 1 Independent Live Candle Audit

on:
  pull_request:
    paths:
      - 'backend/scripts/gate_stage1_live_validation.py'
      - '.github/workflows/gate-stage1-live-candle-audit.yml'

permissions:
  contents: read

jobs:
  gate-testnet-real-candles-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SYSTEM_MODE: PAPER
      GATE_S1_SHADOW_ENABLED: "false"
      GATE_OMS_CONNECTION_ENABLED: "false"
      GATE_OMS_WRITES_ENABLED: "false"
      OMS_TESTNET_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated research dependencies
        working-directory: backend
        run: python -m pip install -e ".[postgres]"
      - name: Independently cross-check 9 real Gate TestNet candle series
        working-directory: backend
        run: python -m scripts.gate_stage1_live_validation
