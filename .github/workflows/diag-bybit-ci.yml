name: Diagnose Bybit CI test hang

on:
  push:
    branches: [diag/bybit-ci-hang]
    paths:
      - .github/workflows/diag-bybit-ci.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev,postgres]"
      - name: Patch SQLite tests to isolated files
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/tests/test_month_5_agent_runtime.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'async def test_sqlite_runtime_persists_trace_and_immutable_evidence():\n    database = Database("sqlite+aiosqlite:///:memory:")',
              'async def test_sqlite_runtime_persists_trace_and_immutable_evidence(tmp_path):\n    database = Database(f"sqlite+aiosqlite:///{tmp_path / \'trace.db\'}")',
              1,
          )
          text = text.replace(
              'async def test_sqlite_runtime_batches_cohort_creation_idempotently():\n    database = Database("sqlite+aiosqlite:///:memory:")',
              'async def test_sqlite_runtime_batches_cohort_creation_idempotently(tmp_path):\n    database = Database(f"sqlite+aiosqlite:///{tmp_path / \'cohort.db\'}")',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Predecessor then culprit with isolated files
        working-directory: backend
        run: |
          timeout 30s python -m pytest -vv -s -p no:cacheprovider \
            app/tests/test_month_5_agent_runtime.py::test_sqlite_runtime_persists_trace_and_immutable_evidence \
            app/tests/test_month_5_agent_runtime.py::test_sqlite_runtime_batches_cohort_creation_idempotently
      - name: Full Month 5 file
        working-directory: backend
        run: timeout 60s python -m pytest -vv -p no:cacheprovider app/tests/test_month_5_agent_runtime.py
