name: Diagnose Bybit CI test hang

on:
  push:
    branches: [diag/bybit-ci-hang]
    paths:
      - .github/workflows/diag-bybit-ci.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      REDIS_TEST_URL: redis://localhost:6379/15
      POSTGRES_TEST_URL: postgresql+asyncpg://cipher:cipher@localhost:5432/capital_cipher_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev,postgres]"
      - name: Culprit alone
        working-directory: backend
        run: timeout 20s python -m pytest -vv -s -p no:cacheprovider app/tests/test_month_5_agent_runtime.py::test_sqlite_runtime_batches_cohort_creation_idempotently
      - name: Predecessor then culprit
        working-directory: backend
        run: |
          timeout 30s python -m pytest -vv -s -p no:cacheprovider \
            app/tests/test_month_5_agent_runtime.py::test_sqlite_runtime_persists_trace_and_immutable_evidence \
            app/tests/test_month_5_agent_runtime.py::test_sqlite_runtime_batches_cohort_creation_idempotently
      - name: Month 5 file
        working-directory: backend
        run: timeout 60s python -m pytest -vv -s -p no:cacheprovider app/tests/test_month_5_agent_runtime.py
