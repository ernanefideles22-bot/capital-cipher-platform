name: Diagnose Bybit CI test hang

on:
  push:
    branches: [diag/bybit-ci-hang]
    paths:
      - .github/workflows/diag-bybit-ci.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cipher
          POSTGRES_PASSWORD: cipher
          POSTGRES_DB: capital_cipher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cipher -d capital_cipher_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://localhost:6379/15
      POSTGRES_TEST_URL: postgresql+asyncpg://cipher:cipher@localhost:5432/capital_cipher_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev,postgres]"
      - name: Run newly added safety tests
        working-directory: backend
        run: |
          python -m pytest -vv -p no:cacheprovider \
            app/tests/test_bybit_partial_fill_safety.py \
            app/tests/test_bybit_exit_context_wiring.py
      - name: Run full backend suite with diagnostic timeout
        working-directory: backend
        run: timeout 75s python -m pytest -vv -p no:cacheprovider
