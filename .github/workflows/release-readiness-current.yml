name: Current Release Readiness Evidence

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact 40-character commit SHA validated by CI
        required: true
        type: string
      ci_run_id:
        description: Successful Continuous Integration workflow run ID for that SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    name: Current PAPER release evidence
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         (github.event.workflow_run.head_branch == 'main' ||
          github.event.workflow_run.head_branch == 'deploy/railway-paper-staging'))
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact source and CI run
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
          EVENT_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_SOURCE_REVISION: ${{ inputs.source_revision }}
          INPUT_CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            source_revision="${EVENT_SOURCE_REVISION}"
            ci_run_id="${EVENT_CI_RUN_ID}"
          else
            source_revision="${INPUT_SOURCE_REVISION}"
            ci_run_id="${INPUT_CI_RUN_ID}"
          fi
          if ! [[ "${source_revision}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid source revision: ${source_revision}" >&2
            exit 1
          fi
          if ! [[ "${ci_run_id}" =~ ^[0-9]+$ ]]; then
            echo "Invalid CI run id: ${ci_run_id}" >&2
            exit 1
          fi
          echo "source_revision=${source_revision}" >> "${GITHUB_OUTPUT}"
          echo "ci_run_id=${ci_run_id}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${source_revision:0:8}" >> "${GITHUB_OUTPUT}"

      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.source_revision }}
          persist-credentials: false

      - name: Verify exact source and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
          CI_RUN_ID: ${{ steps.source.outputs.ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_REVISION}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" --jq '.name')" = "Continuous Integration"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" --jq '.head_sha')" = "${SOURCE_REVISION}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" --jq '.conclusion')" = "success"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev,postgres]"

      - name: Run local Bybit emulator safety canary
        working-directory: backend
        run: >-
          python -m pytest
          app/tests/test_local_bybit_emulator.py
          app/tests/test_local_bybit_emulator_e2e_canary.py
          -q

      - name: Generate exact-SHA Month 11 and Month 12 evidence
        shell: bash
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
          CI_RUN_ID: ${{ steps.source.outputs.ci_run_id }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          cd backend
          python scripts/run_month11_shadow_validation.py > ../release-evidence/month11-run.json
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, os
          root = pathlib.Path('..')
          run_path = root / 'release-evidence/month11-run.json'
          month11 = json.loads(run_path.read_text(encoding='utf-8'))
          report = month11['report']
          assert report['status'] == 'PASSED'
          canonical = json.dumps(report, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode()
          report_path = root / 'release-evidence/month11-report.json'
          report_path.write_bytes(canonical)
          report_sha = hashlib.sha256(canonical).hexdigest()
          cmd = [
              'python', 'scripts/run_release_readiness_audit.py',
              '--source-revision', os.environ['SOURCE_REVISION'],
              '--month11-report-id', report['report_id'],
              '--month11-report-sha256', report_sha,
              '--ci-quality-gate-passed',
              '--database-migrations-validated',
          ]
          out_path = root / 'release-evidence/month12-release-evidence.json'
          with out_path.open('wb') as output:
              subprocess.run(cmd, check=True, stdout=output)
          bundle = json.loads(out_path.read_text(encoding='utf-8'))
          assert bundle['status'] == 'PASSED'
          assert bundle['source_revision'] == os.environ['SOURCE_REVISION']
          assert len(bundle['checks']) == 10
          assert all(item['status'] == 'PASSED' for item in bundle['checks'])
          summary = {
              'source_revision': os.environ['SOURCE_REVISION'],
              'ci_run_id': int(os.environ['CI_RUN_ID']),
              'month11_report_id': report['report_id'],
              'month11_report_sha256': report_sha,
              'month12_evidence_bundle_id': bundle['evidence_bundle_id'],
              'month12_bundle_sha256': bundle['bundle_sha256'],
              'month12_status': bundle['status'],
              'audit_checks_passed': sum(item['status'] == 'PASSED' for item in bundle['checks']),
              'live_execution_surface_present': bundle['live_execution_surface_present'],
              'local_emulator_canary': 'PASSED_IN_RELEASE_EVIDENCE',
              'external_testnet_credentials_present': False,
          }
          (root / 'release-evidence/evidence-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload current release evidence
        uses: actions/upload-artifact@v6
        with:
          name: capital-cipher-release-evidence-${{ steps.source.outputs.short_sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
