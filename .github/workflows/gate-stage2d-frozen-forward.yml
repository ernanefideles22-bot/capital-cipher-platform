name: Gate S2D Locked Forward Policy + Public Range Check

on:
  pull_request:
    paths:
      - 'backend/app/strategy/gate_s2d_history.py'
      - 'backend/app/strategy/gate_s2d_forward.py'
      - 'backend/app/tests/test_gate_s2d_frozen_forward.py'
      - 'backend/scripts/gate_s2d_range_forward_probe.py'
      - '.github/workflows/gate-stage2d-frozen-forward.yml'
      - 'docs/76-gate-s2d-prospective-policy-20261101.md'

permissions:
  contents: read

jobs:
  s2d-causal-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYSTEM_MODE: PAPER
      OMS_TESTNET_ENABLED: "false"
      GATE_OMS_CONNECTION_ENABLED: "false"
      GATE_OMS_WRITES_ENABLED: "false"
      GATE_S1_SHADOW_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests
        working-directory: backend
        run: python -m pip install -e ".[dev,postgres]"
      - name: Validate range data, future receipts, S1/S2C causal and OMS safety
        working-directory: backend
        run: |
          python -m pytest -q \
            app/tests/test_gate_s2d_frozen_forward.py \
            app/tests/test_gate_s2c_confluence.py \
            app/tests/test_gate_s2b_loss_diagnostics.py \
            app/tests/test_gate_s2_classical_replay.py \
            app/tests/test_professional_gate_chart_stage1.py \
            app/tests/test_gate_readonly.py \
            app/tests/test_gate_oms_connection.py
  s2d-public-testnet-paged-range:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYSTEM_MODE: PAPER
      OMS_TESTNET_ENABLED: "false"
      GATE_OMS_CONNECTION_ENABLED: "false"
      GATE_OMS_WRITES_ENABLED: "false"
      GATE_S1_SHADOW_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated public GET dependencies
        working-directory: backend
        run: python -m pip install -e ".[postgres]"
      - name: Probe public paged Gate history and forward readiness, no orders
        working-directory: backend
        run: python -m scripts.gate_s2d_range_forward_probe
