name: Release Readiness Evidence

on:
  push:
    branches:
      - release/readiness-e967-evidence
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_REVISION: e967c234220c673084ad3a9e618603b4ad3d52af
  EXACT_CI_RUN_ID: "37711698153"
  TREE_EQUIVALENT_CI_RUN_ID: "37711262950"

jobs:
  evidence:
    name: Frozen PAPER release evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen source revision
        uses: actions/checkout@v7
        with:
          ref: e967c234220c673084ad3a9e618603b4ad3d52af
          persist-credentials: false

      - name: Verify frozen revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_REVISION}"

      - name: Verify official CI provenance
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_tree="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_REVISION}" --jq '.commit.tree.sha')"
          exact_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_CI_RUN_ID}" --jq '.status')"
          exact_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_CI_RUN_ID}" --jq '.conclusion // ""')"
          exact_head="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_CI_RUN_ID}" --jq '.head_sha')"

          ci_run_id=""
          evidence_mode=""
          if [ "${exact_status}" = "completed" ] && [ "${exact_conclusion}" = "success" ] && [ "${exact_head}" = "${SOURCE_REVISION}" ]; then
            ci_run_id="${EXACT_CI_RUN_ID}"
            evidence_mode="exact_revision"
          else
            fallback_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TREE_EQUIVALENT_CI_RUN_ID}" --jq '.conclusion // ""')"
            fallback_head="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TREE_EQUIVALENT_CI_RUN_ID}" --jq '.head_sha')"
            fallback_tree="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${fallback_head}" --jq '.commit.tree.sha')"
            test "${fallback_conclusion}" = "success"
            test "${fallback_tree}" = "${source_tree}"
            ci_run_id="${TREE_EQUIVALENT_CI_RUN_ID}"
            evidence_mode="source_tree_equivalent"
          fi

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}" --jq '.name')" = "Continuous Integration"
          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}/jobs?per_page=100")"
          for required_step in \
            "Validate Supabase migrations on disposable PostgreSQL" \
            "Build and preflight staging image" \
            "Validate hosted staging contract" \
            "Build, typecheck, and test all packages" \
            "Build hosted PAPER image with dashboard"
          do
            result="$(printf '%s' "${jobs_json}" | jq -r --arg step "${required_step}" '[.jobs[].steps[] | select(.name == $step) | .conclusion][0] // ""')"
            test "${result}" = "success"
          done

          echo "ci_run_id=${ci_run_id}" >> "${GITHUB_OUTPUT}"
          echo "evidence_mode=${evidence_mode}" >> "${GITHUB_OUTPUT}"
          echo "source_tree=${source_tree}" >> "${GITHUB_OUTPUT}"

          mkdir -p release-evidence
          CI_RUN_ID="${ci_run_id}" EVIDENCE_MODE="${evidence_mode}" SOURCE_TREE="${source_tree}" EXACT_STATUS="${exact_status}" EXACT_CONCLUSION="${exact_conclusion}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "workflow": "Continuous Integration",
              "source_revision": os.environ["SOURCE_REVISION"],
              "source_git_tree": os.environ["SOURCE_TREE"],
              "evidence_run_id": int(os.environ["CI_RUN_ID"]),
              "evidence_mode": os.environ["EVIDENCE_MODE"],
              "exact_revision_ci_run_id": int(os.environ["EXACT_CI_RUN_ID"]),
              "exact_revision_ci_status": os.environ["EXACT_STATUS"],
              "exact_revision_ci_conclusion": os.environ["EXACT_CONCLUSION"] or None,
              "tree_equivalent_ci_run_id": int(os.environ["TREE_EQUIVALENT_CI_RUN_ID"]),
              "required_steps_verified": [
                  "Validate Supabase migrations on disposable PostgreSQL",
                  "Build and preflight staging image",
                  "Validate hosted staging contract",
                  "Build, typecheck, and test all packages",
                  "Build hosted PAPER image with dashboard",
              ],
          }
          Path("release-evidence/official-ci.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend evidence dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,postgres]"

      - name: Run deterministic Month 11 PAPER shadow validation
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_month11_shadow_validation.py > ../release-evidence/month11-run.json

      - name: Validate and content-address Month 11 report
        id: month11
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          source = Path("release-evidence/month11-run.json")
          payload = json.loads(source.read_text(encoding="utf-8"))
          assert payload["month"] == 11
          assert payload["execution_mode"] == "PAPER"
          assert payload["live_execution_attempted"] is False
          assert payload["registered_agents"] == 300

          report = payload["report"]
          assert report["status"] == "PASSED"
          assert report["live_execution_attempted"] is False
          assert report["total_checkpoints"] == 8
          assert report["executed_checkpoints"] == 6
          assert report["suspended_checkpoints"] == 2
          assert report["total_agent_executions"] == 1800
          assert report["failed_agent_executions"] == 0
          assert report["reconciliation_runs"] == 8
          assert report["reconciliation_critical_mismatches"] == 0
          assert report["initial_order_count"] == report["final_order_count"] == 0
          assert report["initial_paper_trade_count"] == report["final_paper_trade_count"] == 0
          assert all(report["invariants"].values())

          canonical = json.dumps(
              report,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=True,
          ).encode("utf-8")
          Path("release-evidence/month11-report.json").write_bytes(canonical)
          report_sha = hashlib.sha256(canonical).hexdigest()
          report_id = report["report_id"]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"report_id={report_id}\n")
              handle.write(f"report_sha256={report_sha}\n")
          PY

      - name: Generate Month 12 technical evidence bundle
        working-directory: backend
        env:
          MONTH11_REPORT_ID: ${{ steps.month11.outputs.report_id }}
          MONTH11_REPORT_SHA256: ${{ steps.month11.outputs.report_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_release_readiness_audit.py \
            --source-revision "${SOURCE_REVISION}" \
            --month11-report-id "${MONTH11_REPORT_ID}" \
            --month11-report-sha256 "${MONTH11_REPORT_SHA256}" \
            --ci-quality-gate-passed \
            --database-migrations-validated \
            > ../release-evidence/month12-release-evidence.json

      - name: Validate Month 12 bundle and prepare external-audit handoff
        env:
          MONTH11_REPORT_ID: ${{ steps.month11.outputs.report_id }}
          MONTH11_REPORT_SHA256: ${{ steps.month11.outputs.report_sha256 }}
          CI_EVIDENCE_RUN_ID: ${{ steps.ci.outputs.ci_run_id }}
          CI_EVIDENCE_MODE: ${{ steps.ci.outputs.evidence_mode }}
          SOURCE_GIT_TREE: ${{ steps.ci.outputs.source_tree }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              Path("release-evidence/month12-release-evidence.json").read_text(encoding="utf-8")
          )
          assert evidence["status"] == "PASSED"
          assert evidence["source_revision"] == os.environ["SOURCE_REVISION"]
          assert evidence["month11_report_id"] == os.environ["MONTH11_REPORT_ID"]
          assert evidence["month11_report_sha256"] == os.environ["MONTH11_REPORT_SHA256"]
          assert evidence["contract_count"] == 56
          assert evidence["live_execution_surface_present"] is False
          assert len(evidence["checks"]) == 10
          assert all(item["status"] == "PASSED" for item in evidence["checks"])

          handoff = {
              "baseline_only": True,
              "source_revision": os.environ["SOURCE_REVISION"],
              "source_git_tree": os.environ["SOURCE_GIT_TREE"],
              "ci_evidence_run_id": int(os.environ["CI_EVIDENCE_RUN_ID"]),
              "ci_evidence_mode": os.environ["CI_EVIDENCE_MODE"],
              "exact_revision_ci_run_id": int(os.environ["EXACT_CI_RUN_ID"]),
              "month11_report_id": evidence["month11_report_id"],
              "month11_report_sha256": evidence["month11_report_sha256"],
              "release_evidence_bundle_id": evidence["evidence_bundle_id"],
              "release_evidence_bundle_sha256": evidence["bundle_sha256"],
              "source_tree_sha256": evidence["source_tree_sha256"],
              "technical_evidence_status": evidence["status"],
              "audit_checks": {
                  item["check_name"]: item["status"] for item in evidence["checks"]
              },
              "hosted_paper_staging": "https://capital-cipher-backend-staging.up.railway.app",
              "known_open_readiness_items_from_pr24": [
                  "exchange_accounting_and_equity",
                  "protected_exits",
                  "reduce_only",
                  "partial_fill_semantics",
                  "leverage_configuration",
                  "bybit_market_feed",
                  "remote_testnet_canary",
              ],
              "testnet_release_authorized": False,
              "live_execution_authorized": False,
              "external_attestation_required": True,
              "local_testnet_canary_executed": False,
              "next_gate": "Close all known readiness items, regenerate evidence on the final SHA, then obtain an independent EXTERNAL attestation before any TESTNET canary or activation.",
          }
          Path("release-evidence/external-audit-handoff.json").write_text(
              json.dumps(handoff, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload immutable release evidence package
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-baseline-e967c234
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
