name: Gate Frozen Policy Economic Diagnostic

on:
  pull_request:
    paths:
      - 'backend/app/strategy/gate_s3_economic_diagnostic.py'
      - 'backend/scripts/gate_s3_economic_diagnostic.py'
      - 'backend/app/tests/test_gate_s3_economic_diagnostic.py'
      - '.github/workflows/gate-economic-diagnostic.yml'

permissions:
  contents: read

jobs:
  offline-contracts-and-public-get-economics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYSTEM_MODE: PAPER
      OMS_TESTNET_ENABLED: "false"
      GATE_S1_SHADOW_ENABLED: "false"
      GATE_S2E_SHADOW_ENABLED: "false"
      GATE_S3_SHADOW_ENABLED: "false"
      GATE_OMS_CONNECTION_ENABLED: "false"
      GATE_OMS_WRITES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev,postgres]"
      - name: Economic identities and frozen S1/S2 regression
        working-directory: backend
        run: |
          python -m pytest -q app/tests/test_gate_s3_economic_diagnostic.py \
            app/tests/test_gate_s2b_loss_diagnostics.py app/tests/test_gate_s2c_confluence.py \
            app/tests/test_gate_s2_classical_replay.py app/tests/test_gate_s2d_frozen_forward.py
      - name: Archive public Testnet history, then diagnose unchanged policies
        working-directory: backend
        run: python -m scripts.gate_s3_economic_diagnostic --capture --output /tmp/gate-economics
      - name: Verify deterministic replay from the archived snapshot without network
        working-directory: backend
        run: |
          python -m scripts.gate_s3_economic_diagnostic \
            --snapshot /tmp/gate-economics/snapshot.json.gz --output /tmp/gate-economics-replay
          cmp /tmp/gate-economics/economic-diagnostic.json /tmp/gate-economics-replay/economic-diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-frozen-policy-economic-evidence
          path: /tmp/gate-economics/
          retention-days: 90
          if-no-files-found: error
