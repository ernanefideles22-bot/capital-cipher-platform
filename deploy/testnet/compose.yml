name: capital-cipher-bybit-testnet

# Local TESTNET rehearsal only. The database, Redis instance, volumes and
# network are intentionally named independently from capital-cipher-staging.
# Never put Bybit values in this file; use a local .env file or a secret store.
x-testnet-environment: &testnet-environment
  APP_ENV: test
  SYSTEM_MODE: PAPER
  TESTNET_DEPLOYMENT_TARGET: LOCAL_COMPOSE
  TESTNET_RESOURCE_NAMESPACE: capital-cipher-bybit-testnet
  TESTNET_DATABASE_RESOURCE_ID: local-testnet-postgres
  TESTNET_REDIS_RESOURCE_ID: local-testnet-redis
  TESTNET_DATABASE_EXPECTED_HOST: db
  TESTNET_REDIS_EXPECTED_HOST: redis
  STAGING_DATABASE_RESOURCE_ID: local-staging-postgres
  STAGING_REDIS_RESOURCE_ID: local-staging-redis
  DATABASE_URL: postgresql+asyncpg://capital_cipher_testnet:${TESTNET_POSTGRES_PASSWORD:?set TESTNET_POSTGRES_PASSWORD}@db:5432/capital_cipher_testnet
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-3}
  DATABASE_MAX_OVERFLOW: "0"
  DATABASE_POOL_TIMEOUT_SECONDS: "15"
  DATABASE_POOL_RECYCLE_SECONDS: "300"
  REDIS_URL: redis://:${TESTNET_REDIS_PASSWORD:?set TESTNET_REDIS_PASSWORD}@redis:6379/0
  EVENT_BROKER_REQUIRED: "1"
  REDIS_STREAM_PREFIX: capital-cipher-testnet
  ENABLE_MARKET_DATA: "1"
  DATA_LAKE_ROOT: /var/lib/capital-cipher/data-lake
  ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY}
  CORS_ALLOWED_ORIGINS: ${TESTNET_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8001}
  OMS_EXECUTION_ENVIRONMENT: TESTNET
  OMS_TESTNET_ENABLED: "1"
  OMS_TESTNET_ACKNOWLEDGEMENT: TESTNET_ONLY_NO_REAL_FUNDS
  OMS_TESTNET_EXCHANGE: BYBIT
  BYBIT_TESTNET_REST_URL: https://api-testnet.bybit.com
  BYBIT_TESTNET_CATEGORY: linear
  OMS_WORKER_ENABLED: "1"
  OMS_RECONCILIATION_ENABLED: "1"
  OMS_HALT_ON_CRITICAL_DRIFT: "1"
  CAPITAL_CIPHER_BYBIT_TESTNET_KEY_ID: ${CAPITAL_CIPHER_BYBIT_TESTNET_KEY_ID:?set CAPITAL_CIPHER_BYBIT_TESTNET_KEY_ID}
  CAPITAL_CIPHER_BYBIT_TESTNET_SIGNING_SECRET: ${CAPITAL_CIPHER_BYBIT_TESTNET_SIGNING_SECRET:?set CAPITAL_CIPHER_BYBIT_TESTNET_SIGNING_SECRET}
  OPERATIONS_MONITOR_ENABLED: "1"
  AGENT_WORKER_ENABLED: "1"
  BACKFILL_WORKER_ENABLED: "1"
  REQUIRE_TRUSTED_MARKET_CLOCK: "1"
  DEFAULT_EXCHANGE: BYBIT
  DEFAULT_LEVERAGE: "1"
  MAX_LEVERAGE_SIMULATED: "1"
  RISK_PER_TRADE_PERCENT: "0.10"
  MAX_DAILY_DRAWDOWN_PERCENT: "1"
  MAX_TOTAL_DRAWDOWN_PERCENT: "3"
  MAX_OPEN_POSITIONS: "2"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CAPITAL_CIPHER_BINANCE_TESTNET_KEY_ID: ""
  CAPITAL_CIPHER_BINANCE_TESTNET_SIGNING_SECRET: ""

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: capital_cipher_testnet
      POSTGRES_PASSWORD: ${TESTNET_POSTGRES_PASSWORD:?set TESTNET_POSTGRES_PASSWORD}
      POSTGRES_DB: capital_cipher_testnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capital_cipher_testnet -d capital_cipher_testnet"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - testnet-postgres:/var/lib/postgresql/data
      - ../../supabase/migrations:/docker-entrypoint-initdb.d:ro
    networks: [data]
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.2-alpine
    environment:
      TESTNET_REDIS_PASSWORD: ${TESTNET_REDIS_PASSWORD:?set TESTNET_REDIS_PASSWORD}
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes --appendfsync everysec
        --requirepass "$$TESTNET_REDIS_PASSWORD"
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$TESTNET_REDIS_PASSWORD" ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - testnet-redis:/data
    networks: [data]
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  preflight:
    image: capital-cipher-backend:testnet
    build:
      context: ../../backend
    environment: *testnet-environment
    command: ["python", "scripts/validate_testnet.py"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [data]
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    restart: "no"

  backend:
    image: capital-cipher-backend:testnet
    build:
      context: ../../backend
    environment: *testnet-environment
    command: ["python", "scripts/run_testnet_backend.py"]
    depends_on:
      preflight:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TESTNET_BACKEND_PORT:-8001}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).read()
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 90s
    volumes:
      - testnet-data-lake:/var/lib/capital-cipher/data-lake
    networks: [data, egress]
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true

networks:
  data:
    internal: true
  egress: {}

volumes:
  testnet-postgres:
  testnet-redis:
  testnet-data-lake:
